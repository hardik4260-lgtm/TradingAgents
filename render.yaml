# Free single-instance Python deployment; AI provider usage is billed separately.
# Select the branch containing this file when creating the Blueprint.
services:
  - type: web
    name: tradingagents-engine
    runtime: python
    plan: free
    region: virginia
    numInstances: 1
    buildCommand: pip install ".[mcp]"
    startCommand: python -m tradingagents.cloud_server
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TRADINGAGENTS_MCP_HOST
        value: 0.0.0.0
      - key: TRADINGAGENTS_LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: TRADINGAGENTS_QUICK_THINK_LLM
        sync: false
      - key: TRADINGAGENTS_DEEP_THINK_LLM
        sync: false
      - key: TRADINGAGENTS_MCP_ISSUER
        sync: false
      - key: TRADINGAGENTS_MCP_RESOURCE_URL
        sync: false
      - key: TRADINGAGENTS_MCP_JWKS_URL
        sync: false
      - key: TRADINGAGENTS_MCP_OWNER_SUBJECT
        sync: false
